# CI проекта: сборка, юнит-тесты и lint — те же проверки, что локально.
# Наличие этого файла отключает Auto DevOps (его Heroku/Docker-задачи раннеру не подходят).
# Окружение (JDK 21, Android SDK/NDK) готовит ci/setup-android.sh — с кешем на раннере.
#
# Одна задача, а не три: раннер (custom executor) запускает задачи проекта в одной и той же папке,
# параллельные задачи стирали друг другу app/build/. Шаги — по очереди, отдельными вызовами Gradle:
# одновременные тесты и lint обрывали задачу (похоже на нехватку памяти раннера), а так в логе
# видно, на каком шаге это происходит.

variables:
  # Без фонового демона: процесс Gradle не остаётся на раннере после задачи.
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  # Kotlin-компилятор — внутри процесса Gradle (общий Kotlin-демон раннера не делится между
  # сборками); не больше двух параллельных воркеров.
  GRADLE_ARGS: "--stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process"

check:
  timeout: 30 minutes
  before_script:
    - ci/runner-resources.sh
    - source ci/setup-android.sh
  script:
    - echo "=== assembleDebug" && ./gradlew :app:assembleDebug $GRADLE_ARGS
    - ci/runner-resources.sh
    - echo "=== testDebugUnitTest" && ./gradlew :app:testDebugUnitTest $GRADLE_ARGS || failed=1
    - ci/runner-resources.sh
    - echo "=== lintDebug" && ./gradlew :app:lintDebug $GRADLE_ARGS || failed=1
    - echo "=== hostNativeTest" && ./gradlew :app:hostNativeTest $GRADLE_ARGS || failed=1
    - exit ${failed:-0}
  artifacts:
    when: always
    reports:
      junit: app/build/test-results/testDebugUnitTest/TEST-*.xml
    paths:
      - app/build/outputs/apk/debug/app-debug.apk
      - app/build/reports/tests/testDebugUnitTest/
      - app/build/reports/lint-results-debug.html
      - app/build/reports/lint-results-debug.xml
    expire_in: 1 week
